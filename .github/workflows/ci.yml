name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y lua5.4 mpv shellcheck

      - name: Run repository checks
        run: bash tools/check.sh
