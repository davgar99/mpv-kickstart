name: Update mpv plugins

on:
  schedule:
    - cron: '17 13 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/plugin-sources.tsv
      - tools/update-plugins.sh
      - tools/check.sh
      - .github/workflows/update-plugins.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y lua5.4 mpv

      - name: Fetch latest plugin versions
        run: bash tools/update-plugins.sh

      - name: Validate updated repository
        run: bash tools/check.sh

      - name: Commit plugin updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ script-opts/modernz.conf
          if git diff --cached --quiet; then
            echo "Plugins and compatibility settings are already current."
            exit 0
          fi
          git commit -m "chore: update mpv plugins"
          git pull --rebase origin main
          git push origin HEAD:main
