name: Update mpv plugins

on:
  schedule:
    - cron: '17 13 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/plugin-sources.tsv
      - tools/update-plugins.sh
      - tools/check.sh
      - .github/workflows/update-plugins.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y lua5.4 mpv shellcheck

      - name: Fetch latest plugin versions
        run: bash tools/update-plugins.sh

      - name: Validate updated repository
        run: bash tools/check.sh

      - name: Prepare plugin update commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ script-opts/modernz.conf

          if git diff --cached --quiet; then
            echo "Plugins and compatibility settings are already current."
            echo "UPDATES_FOUND=false" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "UPDATES_FOUND=true" >> "$GITHUB_ENV"
          git checkout -B automation/plugin-updates
          git commit -m "chore: update mpv plugins"

      - name: Publish update branch and open pull request
        if: env.UPDATES_FOUND == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: automation/plugin-updates
        shell: bash
        run: |
          set -euo pipefail

          # Introduce repository credentials only after downloaded plugin code
          # has been validated and no further plugin code will be executed.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin "${UPDATE_BRANCH}:refs/remotes/origin/${UPDATE_BRANCH}" 2>/dev/null || true
          git push --force-with-lease origin "HEAD:refs/heads/${UPDATE_BRANCH}"

          pr_number="$(gh pr list --head "${UPDATE_BRANCH}" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -z "${pr_number}" ]]; then
            gh pr create \
              --base main \
              --head "${UPDATE_BRANCH}" \
              --title 'chore: update mpv plugins' \
              --body 'Automated plugin update. Validation completed before repository write credentials were introduced. Review the upstream plugin changes before merging.'
          else
            echo "Updated existing plugin-update PR #${pr_number}."
          fi
