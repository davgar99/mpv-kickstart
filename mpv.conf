# Use ModernZ instead of mpv's built-in OSC while keeping normal window decorations.
osc=no
border=yes
cursor-autohide=1500

# Quality-focused video playback with automatic hardware decoding.
profile=high-quality
vo=gpu-next
hwdec=auto
# Favor responsive controls on modern hardware by minimizing queued frames.
swapchain-depth=1

# Prefer surround layouts when available, then fall back to stereo.
audio-channels=7.1,5.1,stereo

# Let mpv enable caching when it benefits the source, especially network media.
cache=auto

# Resume playback across sessions, similar to a traditional desktop media player.
save-position-on-quit=yes

# Predictable default volume without software amplification above 100%.
volume=100
volume-max=100

# HDR to SDR tone mapping. Remove this when using native HDR passthrough.
tone-mapping=bt.2446a
